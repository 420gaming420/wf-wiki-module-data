name: Sync WARFRAME Wiki Modules

on:
  schedule:
    # Run once a day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_KEY }}
          ref: dev

      - name: Clone scripts repo
        run: git clone --depth 1 https://github.com/420gaming420/wf-wiki-module-scripts /tmp/scripts

      - name: Create symlink for data
        run: |
          mkdir -p /tmp/scripts/data
          ln -sfn $(pwd)/json /tmp/scripts/data/json

      - name: Write config.ini from secret
        run: echo "${{ secrets.CONFIG_INI }}" > /tmp/scripts/config.ini

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm install
        working-directory: /tmp/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip

      - name: Setup SSH key for commit signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BOT_SIGNING_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key
          git config --global commit.gpgsign true

      - name: Setup allowed_signers for commit signing
        run: |
          echo "${{ secrets.ALLOWED_SIGNERS }}" > ~/.ssh/allowed_signers
          git config --global gpg.allowedSignersFile ~/.ssh/allowed_signers

      - name: Track ignore_modules.json for changes
        id: track_ignore
        run: |
          cd /tmp/scripts
          BEFORE=$(md5sum ignore_modules.json | awk '{print $1}')
          echo "Before: $BEFORE"

      - name: Run sync pipeline
        run: bash /tmp/scripts/workflow.sh

      - name: Show git status
        run: git status

      - name: Check ignore_modules.json for changes
        id: check_ignore
        run: |
          cd /tmp/scripts
          AFTER=$(md5sum ignore_modules.json | awk '{print $1}')
          echo "After: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "CHANGE DETECTED"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "NO CHANGE"
          fi

      - name: Push ignore_modules.json to scripts repo
        if: steps.check_ignore.outputs.changed == 'true'
        run: |
          cd /tmp/scripts
          git config user.name "420gaming420"
          git config user.email "320066288+420gaming420@users.noreply.github.com"
          git add ignore_modules.json
          git commit -m "Add failed modules to ignore list"
          git push https://${{ secrets.GH_PUSH_KEY }}@github.com/420gaming420/wf-wiki-module-scripts.git dev

      - name: Push json changes to data repo
        run: |
          git config user.name "420gaming420"
          git config user.email "320066288+420gaming420@users.noreply.github.com"
          if ! git diff --quiet json/ 2>/dev/null; then
            git add json/
            git commit -m "Auto-sync: $(date -u '+%Y-%m-%d')"
            git push https://${{ secrets.GH_PUSH_KEY }}@github.com/420gaming420/wf-wiki-module-data.git dev
          fi
