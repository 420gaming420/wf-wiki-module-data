name: Sync WARFRAME Wiki Modules

on:
  schedule:
    # Run once a day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_KEY }}

      - name: Write config.ini from secret
        run: echo "${{ secrets.CONFIG_INI }}" > config.ini

      - name: Clone scripts repo
        run: git clone --depth 1 https://github.com/420gaming420/wf-wiki-module-scripts /tmp/scripts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install
        working-directory: /tmp/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip

      - name: Setup SSH key for commit signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BOT_SIGNING_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key
          git config --global commit.gpgsign true

      - name: Run sync pipeline
        run: bash /tmp/scripts/workflow.sh

      - name: Commit and push changes
        run: |
          git config user.name "420gaming420"
          git config user.email "320066288+420gaming420@users.noreply.github.com"
          git add json/
          git add ignore_modules.json
          git add stale_modules.json
          git diff --cached --quiet || git commit -m "Auto-sync: $(date -u '+%Y-%m-%d')"
          git push
