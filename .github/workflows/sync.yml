name: Sync WARFRAME Wiki Modules

on:
  schedule:
    # Run once a day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_KEY }}

      - name: Clone scripts repo
        run: git clone --depth 1 https://github.com/420gaming420/wf-wiki-module-scripts /tmp/scripts

      - name: Write config.ini from secret
        run: echo "${{ secrets.CONFIG_INI }}" > /tmp/scripts/config.ini

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install
        working-directory: /tmp/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip

      - name: Setup SSH key for commit signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BOT_SIGNING_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key
          git config --global commit.gpgsign true

      - name: Run sync pipeline (dry run)
        run: bash /tmp/scripts/workflow.sh --dry-run

      - name: Show git status
        run: git status

      - name: Commit and push changes (dry run)
        run: |
          echo "Would run: git config user.name \"420gaming420\""
          echo "Would run: git config user.email \"320066288+420gaming420@users.noreply.github.com\""
          echo "Would run: git add json/"
          echo "Would run: git add ignore_modules.json"
          echo "Would run: git add stale_modules.json"
          echo "Would run: git diff --cached --quiet || git commit -m \"Auto-sync: $(date -u '+%Y-%m-%d')\""
          echo "Would run: git push"
