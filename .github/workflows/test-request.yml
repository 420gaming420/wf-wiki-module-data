name: Test request.py

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_KEY }}
          ref: dev
          repository: 420gaming420/wf-wiki-module-data

      - name: Clone scripts repo
        run: git clone --depth 1 https://github.com/420gaming420/wf-wiki-module-scripts /tmp/scripts

      - name: Write config.ini from secret
        run: echo "${{ secrets.CONFIG_INI }}" > /tmp/scripts/config.ini

      - name: Create symlink for data
        run: |
          mkdir -p /tmp/scripts/data
          ln -sfn /home/runner/work/wf-wiki-module-data/wf-wiki-module-data/json /tmp/scripts/data/json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run request.py (check metafiles)
        run: cd /tmp/scripts && python3 request.py --check-metafiles

      - name: Verify stale_modules.json
        run: |
          echo "=== stale_modules.json line count ==="
          wc -l /tmp/scripts/stale_modules.json
          echo ""
          echo "=== First 50 lines ==="
          head -50 /tmp/scripts/stale_modules.json
