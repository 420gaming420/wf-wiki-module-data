name: Test request.py

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone scripts repo
        run: git clone --depth 1 https://github.com/420gaming420/wf-wiki-module-scripts /tmp/scripts

      - name: Write config.ini from secret
        run: echo "${{ secrets.CONFIG_INI }}" > /tmp/scripts/config.ini

      - name: Create symlink for data
        run: |
          mkdir -p /tmp/scripts/data
          ln -sfn /home/runner/work/wf-wiki-module-data/wf-wiki-module-data/json /tmp/scripts/data/json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Debug - List files
        run: |
          ls -lah /tmp/scripts/
          ls -lah /tmp/scripts/data/ 2>/dev/null || echo "No data/ dir yet"
          echo "=== Symlink target ==="
          readlink /tmp/scripts/data/json 2>/dev/null || echo "No symlink"
          echo "=== Symlink contents ==="
          ls -lah /tmp/scripts/data/json/ 2>/dev/null | head -20 || echo "Symlink broken or empty"
          echo "=== Data repo root ==="
          ls -lah /home/runner/work/wf-wiki-module-data/wf-wiki-module-data/
          echo "=== Data repo json/ ==="
          ls /home/runner/work/wf-wiki-module-data/wf-wiki-module-data/json/ | wc -l
          echo "=== Parent directory ==="
          ls -lah /home/runner/work/wf-wiki-module-data/
          echo "=== Parent parent directory ==="
          ls -lah /home/runner/work/

      - name: Debug - Test path resolution
        run: cd /tmp/scripts && python3 test-request.py

      - name: Run request.py (dry run)
        run: cd /tmp/scripts && echo "python3 request.py"

      - name: Debug - Check outputs
        run: |
          echo "=== stale_modules.json ==="
          cat /tmp/scripts/stale_modules.json | head -50
          echo ""
          echo "=== ignore_modules.json ==="
          cat /tmp/scripts/ignore_modules.json | head -20
          echo ""
          echo "=== Sample metadata file ==="
          cat /tmp/scripts/data/json/Module-Ability-Conclave-data.meta.json 2>/dev/null || echo "File not found"
          echo ""
          echo "=== Actual files in data/json ==="
          ls /tmp/scripts/data/json/*.meta.json 2>/dev/null | head -10 || echo "No .meta.json files found"
