name: Manual Attribution Config Test

on:
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_KEY }}
          ref: dev

      - name: Clone scripts repo
        run: git clone --depth 1 https://github.com/420gaming420/wf-wiki-module-scripts /tmp/scripts

      - name: Create symlink for data subfolders
        run: |
          mkdir -p /tmp/scripts/data
          ln -sfn $(pwd)/html /tmp/scripts/data/html
          ln -sfn $(pwd)/json /tmp/scripts/data/json
          ln -sfn $(pwd)/lua /tmp/scripts/data/lua
          ln -sfn $(pwd)/markdown /tmp/scripts/data/markdown

      - name: Write config.ini from secret
        run: echo "${{ secrets.CONFIG_INI }}" > /tmp/scripts/config.ini

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm install
        working-directory: /tmp/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip

      - name: Install Python package dependencies
        run: python -m pip install -r requirements.txt
        working-directory: /tmp/scripts

      - name: Setup SSH key for commit signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BOT_SIGNING_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key
          git config --global commit.gpgsign true

      - name: Setup allowed_signers for commit signing
        run: |
          echo "${{ secrets.ALLOWED_SIGNERS }}" > ~/.ssh/allowed_signers
          git config --global gpg.allowedSignersFile ~/.ssh/allowed_signers

      - name: Track ignore_modules.json for changes
        id: track_ignore
        run: |
          cd /tmp/scripts
          BEFORE=$(md5sum ignore_modules.json | awk '{print $1}')
          echo "Before: $BEFORE"

      - name: Run manual attribution.py
        run: |
          python3 request.py
          python3 attribution.py --force --verbose

      - name: Show git status
        run: git status

      - name: Push data changes to repo
        run: |
          git config user.name "420gaming420"
          git config user.email "320066288+420gaming420@users.noreply.github.com"
          git add html/ lua/ markdown/ json/
          if ! git diff --cached --quiet; then
            git commit -m "Manual attribution.py config test"
            git push https://${{ secrets.GH_PUSH_KEY }}@github.com/420gaming420/wf-wiki-module-data.git dev
          fi
